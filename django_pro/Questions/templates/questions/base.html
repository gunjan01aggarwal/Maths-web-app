{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maths Web App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <link href="{% static 'questions/style.css' %}" rel="stylesheet">

</head>
<body>
    <div class="sidenav">
        <nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="#">
                <img src="{% static 'questions/imgs/logo.png' %}"
                     alt="Logo" 
                     width="100" 
                     height="80" 
                     class="d-inline-block align-text-top">
            </a>
        </nav>

        <div class="menu">
            <a href="{% url 'Questions:quest1' %}"><i class="fa-solid fa-question"></i> Question1 </a>
            <a href="{% url 'Questions:quest2' %}"><i class="fa-solid fa-question"></i> Question2 </a>
        </div>

        <div class="bottom-text">
            <h6>Lawtech Math Prob </h6>
        </div>
    </div>

    <div class="main">
        {% block body %}
        {% endblock %}
    </div>
</body>
</html>
